    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#tdsf-bg)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#F5F1E6" stroke-opacity="0.10" stroke-width="3" />
  <path d="M148 172 L272 256 L148 340" fill="none" stroke="#F5F1E6" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
