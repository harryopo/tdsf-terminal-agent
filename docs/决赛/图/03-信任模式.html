<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TDSF 四档信任模式 · 权限矩阵</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f5;font-family:'Geist','Noto Sans SC','Microsoft YaHei',sans-serif;padding:2rem;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{text-align:center;margin-bottom:1.5rem}
.eyebrow{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:8px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:#7a8399;margin-bottom:0.5rem}
h1{font-family:'Instrument Serif','Noto Sans SC',serif;font-size:1.75rem;font-weight:400;color:#2d3142;margin-bottom:0.25rem}
.subtitle{font-size:0.875rem;color:#4f5d75}
.diagram-container{width:100%;max-width:1280px}
svg{width:100%;height:auto;display:block}
footer{margin-top:1.5rem;padding-top:0.75rem;border-top:1px solid rgba(45,49,66,0.12);width:100%;max-width:1280px;display:flex;justify-content:space-between}
footer span{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:9px;color:#7a8399}
</style>
</head>
<body>
<header>
<p class="eyebrow">TRUST MODES · 信任模式权限矩阵</p>
<h1>一个滑杆决定 AI 能动手到什么程度</h1>
<p class="subtitle">四档信任模式：从"只讲不做"的教学到"自主执行"的自动，用户随时切换</p>
</header>
<div class="diagram-container">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-title trust-desc">
<title id="trust-title">TDSF 四档信任模式权限矩阵</title>
<desc id="trust-desc">四层权限递增图：教学档只读讲解、观察档只读分析、确认档逐条审批后执行、自动档低危自动放行高危仍需确认</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<!-- Direction indicator (left margin) -->
<line x1="148" y1="148" x2="148" y2="548" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="148" y="580" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">权限递增</text>
<text x="148" y="136" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.14em">RESTRICTED</text>
<!-- Layer 4: 教学 teach (most restricted, top) -->
<rect x="200" y="148" width="880" height="88" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="212" y="160" width="28" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
<text x="226" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">T4</text>
<text x="280" y="196" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">教学</text>
<text x="340" y="196" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">teach — 只讲不做，先查知识库再结构化讲解</text>
<text x="1060" y="180" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">只读工具集</text>
<text x="1060" y="200" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">6 板块教学输出</text>
<text x="1060" y="220" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">禁止 suggest_command</text>
<!-- Layer 3: 观察 observe -->
<rect x="200" y="256" width="880" height="88" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="212" y="268" width="28" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
<text x="226" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">T3</text>
<text x="280" y="304" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">观察</text>
<text x="340" y="304" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">observe — 只读分析，任何写操作 fail-closed 拒绝</text>
<text x="1060" y="288" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">只读工具集</text>
<text x="1060" y="308" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">写操作物理隔离</text>
<text x="1060" y="328" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">如实报告"未执行"</text>
<!-- Layer 2: 确认 confirm (FOCAL — default, coral) -->
<rect x="200" y="364" width="880" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="212" y="376" width="28" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
<text x="226" y="388" fill="rgba(235,108,54,0.80)" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">T2</text>
<text x="280" y="412" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">确认</text>
<text x="340" y="412" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">confirm — 写操作逐条弹审批卡，人点头才执行（默认档）</text>
<text x="1060" y="396" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">全量 23 工具</text>
<text x="1060" y="416" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">HITL 审批卡</text>
<text x="1060" y="436" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">denylist 硬底线</text>
<!-- Layer 1: 自动 auto (most permissive) -->
<rect x="200" y="472" width="880" height="88" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<rect x="212" y="484" width="28" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
<text x="226" y="496" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">T1</text>
<text x="280" y="520" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">自动</text>
<text x="340" y="520" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">auto — 低危自动放行，L3/L4 高危仍升级确认</text>
<text x="1060" y="504" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">全量 23 工具</text>
<text x="1060" y="524" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">L0-L2 自动放行</text>
<text x="1060" y="544" fill="#7a8399" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="end">L4 任何模式不可绕</text>
<!-- Annotation callout -->
<text x="1240" y="620" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif','Noto Sans SC',serif" text-anchor="end">教学档 = 只读 + 教学皮肤，sidecar 零改动</text>
<path d="M 1080 628 Q 900 640 640 456" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="640" cy="456" r="2" fill="#2d3142"/>
<!-- Legend -->
<line x1="200" y1="660" x2="1080" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="200" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="280" y="672" width="16" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="304" y="684" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">默认档 DEFAULT (确认模式)</text>
<rect x="540" y="672" width="16" height="16" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="564" y="684" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">其他档 OTHER MODES</text>
<text x="800" y="684" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">T4 最受限 → T1 最宽松 · 用户随时切换 · per-session 持久化</text>
</svg>
</div>
<footer>
<span>TDSF Terminal Agent · 火山杯决赛 · 信任模式权限矩阵 (3/3)</span>
<span>diagram-design skill · type: layer stack · 4 layers</span>
</footer>
</body>
</html>
