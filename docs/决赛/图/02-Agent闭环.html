<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TDSF Agent 闭环 · 感知-思考-行动-验证-记忆</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f5;font-family:'Geist','Noto Sans SC','Microsoft YaHei',sans-serif;padding:2rem;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{text-align:center;margin-bottom:1.5rem}
.eyebrow{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:8px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:#7a8399;margin-bottom:0.5rem}
h1{font-family:'Instrument Serif','Noto Sans SC',serif;font-size:1.75rem;font-weight:400;color:#2d3142;margin-bottom:0.25rem}
.subtitle{font-size:0.875rem;color:#4f5d75}
.diagram-container{width:100%;max-width:1280px}
svg{width:100%;height:auto;display:block}
footer{margin-top:1.5rem;padding-top:0.75rem;border-top:1px solid rgba(45,49,66,0.12);width:100%;max-width:1280px;display:flex;justify-content:space-between}
footer span{font-family:'Geist Mono','Noto Sans SC',monospace;font-size:9px;color:#7a8399}
</style>
</head>
<body>
<header>
<p class="eyebrow">AGENT LOOP · 智能体闭环</p>
<h1>感知 → 思考 → 行动 → 验证 → 记忆</h1>
<p class="subtitle">TDSF Agent 的五步操作闭环：每一轮对话都走完这个环，会话状态在中心持续积累</p>
</header>
<div class="diagram-container">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
<title id="loop-title">TDSF Agent 感知-思考-行动-验证-记忆闭环</title>
<desc id="loop-desc">环形闭环图：Agent 每轮对话依次经过感知环境、LLM思考推理、工具执行行动、写后验证、记忆沉淀五个阶段，每步都向中心会话状态写回证据</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7a8399"/></marker>
</defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<!-- Ring flow arrows (solid, clockwise, drawn before nodes) -->
<path d="M 720,132 A 260 260 0 0 1 852,228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 900,380 A 260 260 0 0 1 852,532" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 720,628 A 260 260 0 0 1 560,628" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 428,532 A 260 260 0 0 1 380,380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 428,228 A 260 260 0 0 1 560,132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Write-back spokes (dashed, inward toward hub) -->
<line x1="640" y1="152" x2="640" y2="330" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<line x1="808" y1="326" x2="734" y2="350" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<line x1="769" y1="560" x2="676" y2="429" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<line x1="511" y1="560" x2="604" y2="429" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<line x1="472" y1="326" x2="546" y2="350" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<!-- Station nodes -->
<!-- k=0 感知 (top) -->
<rect x="560" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="560" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="640" y="120" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">感知</text>
<text x="640" y="140" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">环境 · 知识库 · 终端</text>
<!-- k=1 思考 (upper-right) -->
<rect x="808" y="268" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="808" y="268" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="888" y="300" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">思考</text>
<text x="888" y="320" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">LLM 推理 · 置信度</text>
<!-- k=2 行动 (lower-right, FOCAL) -->
<rect x="712" y="560" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="712" y="560" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="792" y="592" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">行动</text>
<text x="792" y="612" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">工具执行 · 审批 · 打字机</text>
<!-- k=3 验证 (lower-left) -->
<rect x="408" y="560" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="408" y="560" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="488" y="592" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">验证</text>
<text x="488" y="612" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">写后验证 · 证据链</text>
<!-- k=4 记忆 (upper-left) -->
<rect x="312" y="268" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="312" y="268" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="392" y="300" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">记忆</text>
<text x="392" y="320" fill="#4f5d75" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">会话沉淀 · 技能包</text>
<!-- Hub (center, dark ink fill) -->
<rect x="552" y="336" width="176" height="88" rx="6" fill="#2d3142"/>
<text x="640" y="376" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">会话状态</text>
<text x="640" y="400" fill="#bfc0c0" font-size="12" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">证据链 · 上下文 · 记忆</text>
<!-- Ring flow labels (on arcs) -->
<rect x="756" y="160" width="48" height="16" rx="2" fill="#f5f5f5"/>
<text x="780" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">RAG</text>
<rect x="888" y="448" width="56" height="16" rx="2" fill="#f5f5f5"/>
<text x="916" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">TOOL</text>
<rect x="608" y="644" width="64" height="16" rx="2" fill="#f5f5f5"/>
<text x="640" y="656" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>
<rect x="376" y="448" width="64" height="16" rx="2" fill="#f5f5f5"/>
<text x="408" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">SINK</text>
<rect x="472" y="160" width="56" height="16" rx="2" fill="#f5f5f5"/>
<text x="500" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.06em">LOOP</text>
<!-- Legend -->
<line x1="40" y1="680" x2="1240" y2="680" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="700" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<path d="M 120,696 A 40 40 0 0 1 160,696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="168" y="700" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">环形流转 RING FLOW (顺时针)</text>
<line x1="400" y1="696" x2="440" y2="696" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
<text x="448" y="700" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">写回中心 WRITE-BACK SPOKE</text>
<rect x="700" y="688" width="16" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="724" y="700" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">焦点站 FOCAL STATION</text>
<rect x="920" y="688" width="16" height="16" rx="4" fill="#2d3142"/>
<text x="944" y="700" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">中心 HUB (积累状态)</text>
</svg>
</div>
<footer>
<span>TDSF Terminal Agent · 火山杯决赛 · Agent 闭环图 (2/3)</span>

</footer>
