name: Release Windows

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-release

      - name: Validate release tag and manifest versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got: $tag"
          }
          ./scripts/check-release-version.ps1 -ExpectedVersion $tag.Substring(1)

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sidecar build dependencies
        run: python -m pip install -r src-tauri/sidecar/requirements-build.txt

      - name: Build and smoke-test bundled sidecar
        shell: pwsh
        run: |
          pnpm build:sidecar:win
          pnpm test:sidecar:exe

      - name: Build NSIS installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TDSF ${{ github.ref_name }}"
          releaseBody: |
            Windows x64 installer for TDSF Terminal Agent.

            Download the NSIS installer and verify it with SHA256SUMS.txt.
            Automatic updates are not enabled in this release.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Upload SHA-256 checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
