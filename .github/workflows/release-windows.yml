name: Release Windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src-tauri/sidecar/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-release

      - name: Validate release tag and manifest versions
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got: $tag"
          }
          ./scripts/check-release-version.ps1 -ExpectedVersion $tag.Substring(1)

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore and verify completion resources
        shell: pwsh
        run: |
          pnpm fetch:carapace
          if ($LASTEXITCODE -ne 0) { throw "Completion resource restore failed" }
          pnpm check:carapace
          if ($LASTEXITCODE -ne 0) { throw "Completion resource verification failed" }
          pnpm test:carapace
          if ($LASTEXITCODE -ne 0) { throw "Completion resource tests failed" }

      - name: Install sidecar build dependencies
        shell: pwsh
        run: |
          # 打包解释器必须是 sidecar/.venv —— `pnpm build:sidecar:win` 现在把 -Python
          # 显式指到那里，并且会核对里面的 strands 版本 == STRANDS_RUNTIME_VERSION。
          # 装在 PATH python 里等于没装（#77 的成因就是"谁在 PATH 上算谁"）。
          python -m venv src-tauri/sidecar/.venv
          if ($LASTEXITCODE -ne 0) { throw "Sidecar virtual environment creation failed" }
          src-tauri/sidecar/.venv/Scripts/python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Sidecar pip upgrade failed" }
          src-tauri/sidecar/.venv/Scripts/python.exe -m pip install -r src-tauri/sidecar/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Sidecar build dependency installation failed" }

      - name: Build and smoke-test bundled sidecar
        shell: pwsh
        run: |
          pnpm build:sidecar:win
          if ($LASTEXITCODE -ne 0) { throw "Sidecar build failed" }
          pnpm test:sidecar:exe
          if ($LASTEXITCODE -ne 0) { throw "Bundled sidecar smoke test failed" }

      - name: Require updater signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # #160: 没有私钥就出包 = 一份装到用户机器上永远收不到更新的安装包。
          # 与其让 tauri 在打包中途报"A public key has been found, but no private key"，
          # 不如在这一步把话说清。
          if (-not $env:KEY) {
            throw "Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY - this release could not deliver automatic updates."
          }

      - name: Compose release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          # 发布说明的唯一主人是 CHANGELOG.md 里对应版本那一节：
          # 缺这一节就直接失败，不许发一个"说明空着"或临时手写的 Release。
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $lines = Get-Content -LiteralPath CHANGELOG.md -Encoding utf8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))\s*$") { $start = $i + 1; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md 找不到 ## $version 这一节，发布说明没有来源。" }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          if ($end -le $start) { throw "CHANGELOG.md 的 $version 一节是空的。" }
          $section = (($lines[$start..($end - 1)]) -join "`n").Trim()
          if (-not $section) { throw "CHANGELOG.md 的 $version 一节是空的。" }
          Set-Content -LiteralPath release-notes.md -Value $section -Encoding utf8
          "body<<BODYEOF" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $section | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "BODYEOF" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "release notes ($($section.Length) chars) come from CHANGELOG ## $version"

      - name: Build NSIS installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TDSF ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # tauri.release.conf.json 只把 createUpdaterArtifacts 打开：
          # 更新使用原始 NSIS 安装器；.exe.sig 和 latest.json 只在发布流程中生成。
          # 所以本地 pnpm build:win 不需要私钥。
          args: --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Verify installer against the configured updater public key
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer for signature verification" }
          cargo run --release --locked --manifest-path src-tauri/Cargo.toml --example verify_updater_signature -- $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Updater signature verification failed; keep release unpublished" }

      - name: Append installer checksum to the notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 以前这里上传一个 SHA256SUMS.txt，用户反馈"文件太多、而且里面的文件名
          # 和上传的资产名对不上（打包出来是空格分隔，tauri-action 上传时改成点号）"。
          # 现在不额外发文件，把校验值并到发布说明里。
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          node scripts/check-carapace.mjs --installer $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer is missing completion resources; keep release unpublished" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = (Get-Content -LiteralPath release-notes.md -Raw -Encoding utf8).TrimEnd()
          Set-Content -LiteralPath release-notes.md -Value "$notes`n`nSHA-256（Windows x64 安装包）：$hash" -Encoding utf8
          gh release edit $env:GITHUB_REF_NAME --notes-file release-notes.md
          Write-Host "installer sha256 = $hash"

