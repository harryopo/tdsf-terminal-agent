name: 功能与改进建议
description: 说明场景、价值与范围
body:
  - type: textarea
    id: problem
    attributes:
      label: 目前的问题与目标用户
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望实现的行为
      description: 给一个具体使用例子，并区分必要功能和长期设想。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可复用的方案与取舍
      description: 可补充官方文档或开源源码；建议不代表项目已实现。
