# TDSF Python Sidecar — 项目配置（pytest + 覆盖率 + 工具链）
# ============================================================================
# 配套 PEP 621 元数据（pyproject.toml 标准）
# 文档: https://packaging.python.org/en/latest/specifications/pyproject-toml/

[project]
name = "tdsf-python-sidecar"
version = "1.0.0"
description = "TDSF Terminal Agent Python Sidecar — LangGraph Agent 引擎"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "TDSF Team" }
]
keywords = ["langgraph", "agent", "linux-ops", "terminal", "tdsf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 运行时依赖（与 requirements.txt 同步）
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "pydantic>=2.0",
    "chromadb>=0.5.0",
    "asyncio-atexit>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

# ============================================================================
# pytest 配置
# 文档: https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "strands_backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 异步测试自动模式（无需 @pytest.mark.asyncio 装饰器）
asyncio_mode = "auto"

# 命令行默认参数
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
    "--showlocals",
    "-p", "no:cacheprovider",
]

# tmp_path 清理配置：ChromaDB 在 Windows 上对 sqlite3 文件持有句柄，
# 测试结束后 tmp_path 自动清理可能失败（PermissionError [WinError 32]），
# 设置 basetemp 到固定路径，避免污染系统 temp 目录
tmp_path_retention_policy = "failed"

# 自定义标记
markers = [
    "slow: 标记慢测试（>1s）",
    "integration: 集成测试（需要外部依赖，如 SQLite/ChromaDB）",
    "e2e: 端到端测试（完整 Agent 流程）",
    "skip_windows: Windows 平台跳过的测试",
    "skip_linux: Linux 平台跳过的测试",
]

# 过滤器配置
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:chromadb.*",
]

# ============================================================================
# 覆盖率配置（coverage.py）
# 文档: https://coverage.readthedocs.io/en/latest/config.html
# ============================================================================
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "conftest.py",
    # T-P5-08: 以下模块属于集成层，需要外部系统依赖（docker CLI / stdio 管道），
    # 单元测试无法覆盖，统一排除以保证覆盖率统计反映真实可测试代码质量。
    # sandbox_proxy.py: 通过 subprocess 调用 docker CLI，需 Docker daemon 运行
    "sandbox_proxy.py",
    # jsonrpc.py: stdio JSON-RPC 协议层，需进程级 stdin/stdout 管道模拟
    "jsonrpc.py",
]
branch = true  # 分支覆盖率

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# ruff 配置（Lint + Format，可选）
# 文档: https://docs.astral.sh/ruff/configuration/
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "htmlcov"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long（由 formatter 处理）
    "B008",  # function call in argument defaults（FastAPI 依赖注入风格）
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================================
# mypy 配置（类型检查，可选）
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 逐步收紧
ignore_missing_imports = true  # chromadb 等无 stub
